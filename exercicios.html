<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercícios | Resultamath</title><link rel="stylesheet" href="estilo.css"></head><body><script src="dados.js"></script><script src="app.js"></script><script>
const m=pagina('exercicios'),P=new URLSearchParams(location.search),mod=P.get('modulo'),qid=P.get('q'),L=QUESTOES.filter(q=>qid?q.id===qid:(!mod||q.modulo===mod)),mods=[...new Set(QUESTOES.map(q=>q.modulo))];let i=0;
const filtro=`<label for="mf">Filtrar por módulo</label><select id="mf" onchange="location.search=this.value?'?modulo='+encodeURIComponent(this.value):''"><option value="">Todos os módulos</option>${mods.map(x=>`<option value="${x}"${x===mod?' selected':''}>${x}</option>`).join('')}</select>`;
function mostra(){if(!L.length){m.innerHTML=`<h1>Exercícios</h1>${filtro}<div class="cartao"><h2>Conteúdo em preparação</h2><p>Ainda não há exercícios cadastrados para esta seleção.</p></div>`;return}const q=L[i];m.innerHTML=`<div class="section-head"><div><span class="tag">PRÁTICA</span><h1 style="margin-top:8px">Exercícios</h1><p>${q.modulo}</p></div><b class="tag">Questão ${i+1} de ${L.length}</b></div>${filtro}<div class="cartao"><h2>${q.enunciado}</h2>${q.alts.map((a,j)=>`<button class="btn sec opcao" onclick="responde(${j})">${String.fromCharCode(65+j)}. ${a}</button>`).join('')}<div id="fb"></div></div>`}
window.responde=j=>{const q=L[i],ok=j===q.certa,p=S.erros.indexOf(q.id);S.resp[q.id]=ok;if(ok&&p>-1)S.erros.splice(p,1);if(!ok&&p<0)S.erros.push(q.id);salvar();document.querySelectorAll('.opcao').forEach((b,k)=>{b.disabled=true;if(k===q.certa)b.classList.add('certa');else if(k===j)b.classList.add('errada')});const video=S.videosQuestoes[q.id]||q.videoResolucao||q.video||'';document.getElementById('fb').innerHTML=`<section class="cartao ${ok?'certa':'errada'}"><h3>${ok?'Resposta correta!':'Vamos entender o erro.'}</h3><p><b>Gabarito: ${q.alts[q.certa]}</b></p><p>${q.resolucao||'A resolução comentada será adicionada em breve.'}</p></section>`+(video?`<h3>Resolução em vídeo</h3>${player(video,'Resolução da questão')}`:'')+(i<L.length-1?'<p><button class="btn" onclick="i++;mostra()">Próxima questão →</button></p>':'<p><a class="btn" href="exercicios.html">Finalizar prática</a></p>')};mostra();
</script></body></html>
