<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações | Resultamath</title><link rel="stylesheet" href="estilo.css"></head><body><script src="dados.js"></script><script src="app.js"></script><script>
const m=pagina('configuracoes');m.innerHTML=`<span class="tag">PERSONALIZAÇÃO</span><h1 style="margin-top:8px">Configurações</h1><p>Atualize seu perfil, gerencie os vídeos e cuide dos seus dados de estudo.</p><section class="cartao"><h2>Seu perfil</h2><label for="n">Nome de exibição</label><input id="n" maxlength="60" placeholder="Como podemos chamar você?" value="${String(S.nome||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><p><button class="btn" id="salvaNome">Salvar perfil</button></p></section><section class="cartao"><span class="tag">ÁREA DO PROFESSOR</span><h2 style="margin-top:10px">Gerenciar vídeos</h2><p class="suave">Adicione ou atualize os links de vídeos das aulas e das resoluções. Os vídeos serão exibidos dentro da plataforma.</p><label for="tipo">Tipo de conteúdo</label><select id="tipo"><option value="aula">Vídeo de uma aula</option><option value="questao">Resolução de uma questão</option></select><label for="item">Selecione o conteúdo</label><select id="item"></select><label for="url">Link do vídeo (YouTube ou Vimeo)</label><input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..."><p class="suave">Cole o link normal do YouTube, youtu.be ou o link de incorporação.</p><div class="linha" style="justify-content:flex-start"><button class="btn" id="salvarVideo">Salvar vídeo</button><button class="btn sec" id="removerVideo">Remover vídeo</button></div><p id="status" class="suave" aria-live="polite"></p></section><section class="cartao"><h2>Dados e progresso</h2><p class="suave">O progresso e os vídeos personalizados ficam salvos neste navegador. Exporte uma cópia de segurança.</p><div class="linha" style="justify-content:flex-start"><button class="btn sec" id="exportar">Exportar backup</button><button class="btn sec" id="zerar">Zerar progresso</button></div></section>`;
const tipo=document.getElementById('tipo'),item=document.getElementById('item'),url=document.getElementById('url'),status=document.getElementById('status');function mapa(){return tipo.value==='aula'?S.videosAulas:S.videosQuestoes}function atualizar(){url.value=mapa()[item.value]||'';status.textContent=url.value?'Vídeo cadastrado para este conteúdo.':'Nenhum vídeo personalizado cadastrado.'}function preencher(){const lista=tipo.value==='aula'?AULAS:QUESTOES;item.innerHTML=lista.map(x=>`<option value="${x.id}">${tipo.value==='aula'?x.modulo+' — '+x.titulo:x.modulo+' — '+x.enunciado}</option>`).join('');atualizar()}tipo.onchange=preencher;item.onchange=atualizar;preencher();document.getElementById('salvaNome').onclick=()=>{S.nome=document.getElementById('n').value.trim();salvar();status.textContent='Perfil atualizado.'};document.getElementById('salvarVideo').onclick=()=>{if(!videoUrl(url.value)){status.textContent='Link inválido. Use um link válido do YouTube ou Vimeo.';return}mapa()[item.value]=url.value.trim();salvar();status.textContent='Vídeo salvo! Ele estará disponível no conteúdo selecionado.'};document.getElementById('removerVideo').onclick=()=>{delete mapa()[item.value];url.value='';salvar();status.textContent='Vídeo personalizado removido.'};document.getElementById('exportar').onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='backup-resultamath.json';a.click();URL.revokeObjectURL(u)};document.getElementById('zerar').onclick=()=>{if(confirm('Apagar todo o progresso e vídeos personalizados deste navegador?')){S={nome:S.nome,feitas:{},resp:{},erros:[],simulados:[],videosAulas:{},videosQuestoes:{}};salvar();location.href='inicio.html'}};
</script></body></html>
