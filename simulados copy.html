<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulados | Resultamath</title><link rel="stylesheet" href="estilo.css"></head><body><script src="dados.js"></script><script src="app.js"></script><script>
const m=pagina('simulados');function inicio(){m.innerHTML=`<span class="tag">AVALIAÇÃO</span><h1 style="margin-top:8px">Simulados</h1><p>Teste seus conhecimentos com questões selecionadas dos módulos estudados.</p><div class="cartao destaque"><h2>Simulado de matemática</h2><p>Até 10 questões. O gabarito e o resultado aparecem ao finalizar.</p><button class="btn" onclick="comeca()">Iniciar simulado →</button></div>`+(S.simulados.length?'<h2>Histórico de tentativas</h2>'+S.simulados.slice().reverse().map(s=>`<div class="cartao linha"><span>${s.d}</span><b>${s.ac} de ${s.n} questões · ${pct(s.ac,s.n)}%</b></div>`).join(''):'')}window.comeca=()=>{const L=QUESTOES.slice().sort(()=>Math.random()-.5).slice(0,10);if(!L.length){m.innerHTML='<h1>Simulados</h1><p>Cadastre questões em dados.js para liberar os simulados.</p>';return}m.innerHTML='<h1>Simulado</h1><p>Responda todas as questões e finalize para ver seu resultado.</p><form id="f">'+L.map((q,i)=>`<div class="cartao"><span class="tag">QUESTÃO ${i+1}</span><h2 style="margin-top:10px">${q.enunciado}</h2>${q.alts.map((a,j)=>`<label class="opcao-r"><input type="radio" name="q${i}" value="${j}" required> ${a}</label>`).join('')}</div>`).join('')+'<button class="btn">Finalizar simulado</button></form>';document.getElementById('f').onsubmit=e=>{e.preventDefault();let ac=0;const d=new FormData(e.target);L.forEach((q,i)=>{const v=d.get('q'+i),ok=v!==null&&+v===q.certa;if(ok)ac++;S.resp[q.id]=ok;if(!ok&&!S.erros.includes(q.id))S.erros.push(q.id);if(ok){const p=S.erros.indexOf(q.id);if(p>-1)S.erros.splice(p,1)}});S.simulados.push({d:new Date().toLocaleDateString('pt-BR'),ac,n:L.length});salvar();m.innerHTML=`<span class="tag">RESULTADO</span><h1 style="margin-top:8px">Simulado finalizado</h1><div class="cartao destaque"><span class="num">${pct(ac,L.length)}%</span><h2>${ac} de ${L.length} acertos</h2><p>As questões que você errou foram adicionadas ao caderno de erros.</p></div><a class="btn" href="erros.html">Revisar erros</a> <a class="btn sec" href="simulados.html">Voltar</a>`}};inicio();
</script></body></html>
