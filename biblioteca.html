<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca | Resultamath</title><link rel="stylesheet" href="estilo.css"></head><body><script src="dados.js"></script><script src="app.js"></script><script>
const m=pagina('biblioteca'),mods=modulos();m.innerHTML=`<div class="section-head"><div><span class="tag">CONTEÚDO ORGANIZADO</span><h1 style="margin-top:8px">Biblioteca de aulas</h1><p>Aprenda por etapas e acompanhe sua evolução em cada módulo.</p></div><span class="tag">${AULAS.length} aulas</span></div>`+mods.map(mod=>{const d=mod.aulas.filter(a=>S.feitas[a.id]).length;return `<section class="cartao"><div class="linha"><div><h2>${mod.nome}</h2><p class="suave">${d} de ${mod.aulas.length} aulas concluídas</p></div><b class="tag">${pct(d,mod.aulas.length)}%</b></div>${barra(pct(d,mod.aulas.length))}${mod.aulas.map(a=>`<div class="aula"><div><b>${a.titulo}</b><div class="suave">${(S.videosAulas[a.id]||a.video)?'▶ Vídeo disponível':'Material de aula'}</div></div><a class="btn sec" href="aula.html?id=${encodeURIComponent(a.id)}">${S.feitas[a.id]?'Revisar aula':'Acessar aula'} →</a></div>`).join('')}</section>`}).join('')||'<p>Nenhuma aula cadastrada.</p>';
</script></body></html>
