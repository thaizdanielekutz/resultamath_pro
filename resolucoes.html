
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resoluções em vídeo | Resultamath</title>
<link rel="stylesheet" href="estilo.css">
</head>

<body>

<script src="dados.js"></script>
<script src="app.js"></script>

<script>

const m = pagina('resolucoes');

function render() {

    const cadastradas = RESOLUCOES.filter(q => q.video);

    m.innerHTML = `

        <div class="section-head">
            <div>
                <span class="tag">QUESTÕES COMENTADAS</span>
                <h1 style="margin-top:8px">Resoluções em vídeo</h1>
                <p>Questões de concursos públicos resolvidas passo a passo.</p>
            </div>
        </div>

        <input
            id="busca-res"
            class="search-input"
            type="search"
            placeholder="Buscar questão, banca, concurso ou assunto..."
            aria-label="Buscar resolução"
        >

        <p class="suave" id="contador-res"></p>

        <div id="lista-res"></div>

    `;

    const box = document.getElementById('lista-res');
    const contador = document.getElementById('contador-res');

    function filtra() {

        const term = document
            .getElementById('busca-res')
            .value
            .toLocaleLowerCase('pt-BR');

        const lista = cadastradas.filter(q => {

            const texto = `
                ${q.banca}
                ${q.concurso}
                ${q.ano}
                ${q.cargo}
                ${q.assunto}
                ${q.enunciado}
            `.toLocaleLowerCase('pt-BR');

            return texto.includes(term);

        });

        contador.textContent =
            `${lista.length} resolução(ões) encontrada(s).`;

        box.innerHTML = lista.map(q => `

            <article class="cartao" style="margin-bottom:20px">

                <div class="video-row">

                    <div>

                        <span class="tag">${q.banca}</span>

                        <h2 style="margin-top:10px">
                            ${q.concurso}
                        </h2>

                        <p class="suave">
                            ${q.cargo} | ${q.ano}
                        </p>

                        <p>
                            <strong>Assunto:</strong> ${q.assunto}
                        </p>

                        <p>
                            ${q.enunciado}
                        </p>

                        <p class="suave">
                            Gabarito: ${q.gabarito}
                        </p>

                        <div>
                            ${q.alternativas.map((alt, i) => `
                                <p>${String.fromCharCode(65+i)}) ${alt}</p>
                            `).join('')}
                        </div>

                    </div>

                    <div>
                        ${player(q.video, 'Resolução: ' + q.concurso)}
                    </div>

                </div>

            </article>

        `).join('') || `

            <div class="empty-state">
                Nenhuma resolução encontrada.
            </div>

        `;

    }

    document
        .getElementById('busca-res')
        .addEventListener('input', filtra);

    filtra();

}

render();

</script>

</body>
</html>
