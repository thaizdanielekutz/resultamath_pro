
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>Resoluções em vídeo | ResultaMath</title>

    <link rel="stylesheet" href="estilo.css">

    <style>
        .resolucoes-container {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap: 24px;
            align-items: start;
        }

        .resolucoes-sidebar,
        .resolucoes-player {
            background: var(--card, #fff);
            border: 1px solid var(--border, #e5e7eb);
            border-radius: 14px;
            padding: 20px;
        }

        .resolucoes-sidebar h2,
        .resolucoes-player h2 {
            margin-top: 0;
        }

        .filtro-resolucoes {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .filtro-resolucoes select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            font: inherit;
        }

        .lista-questoes {
            display: grid;
            gap: 8px;
        }

        .questao-item {
            width: 100%;
            padding: 12px;
            text-align: left;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font: inherit;
        }

        .questao-item:hover {
            border-color: #069eda;
        }

        .questao-item.selecionada {
            border-color: #069eda;
            background: #eef9fd;
        }

        .questao-item strong {
            display: block;
            margin-bottom: 4px;
        }

        .questao-item small {
            color: #777;
        }

        .video {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
        }

        .video iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .sem-video,
        .sem-questoes {
            padding: 35px 20px;
            text-align: center;
            color: #777;
            background: #f8fafc;
            border-radius: 10px;
        }

        .questao-enunciado {
            line-height: 1.7;
            white-space: pre-line;
            margin-bottom: 20px;
        }

        .alternativas {
            display: grid;
            gap: 8px;
            margin-bottom: 20px;
        }

        .alternativa {
            padding: 10px 12px;
            border-radius: 8px;
            background: #f8fafc;
        }

        .gabarito {
            padding: 12px;
            background: #eef9fd;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 850px) {
            .resolucoes-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <script src="dados.js"></script>
    <script src="app.js"></script>

    <main class="pagina-resolucoes">

        <header class="cabecalho-pagina">
            <h1>Resoluções em vídeo</h1>
            <p>Questões comentadas e resolvidas passo a passo.</p>
        </header>

        <section class="resolucoes-container">

            <aside class="resolucoes-sidebar">

                <h2>Questões</h2>

                <div class="filtro-resolucoes">

                    <select id="filtroBanca">
                        <option value="">Todas as bancas</option>
                    </select>

                    <select id="filtroConcurso">
                        <option value="">Todos os concursos</option>
                    </select>

                </div>

                <div id="listaQuestoes" class="lista-questoes">
                    <div class="sem-questoes">
                        Carregando questões...
                    </div>
                </div>

            </aside>

            <section class="resolucoes-player">

                <div id="playerArea">

                    <div class="sem-video">
                        <h2>Escolha uma questão</h2>
                        <p>Selecione uma questão ao lado para assistir à resolução.</p>
                    </div>

                </div>

            </section>

        </section>

    </main>

    <script>
        const listaQuestoes = document.getElementById('listaQuestoes');
        const filtroBanca = document.getElementById('filtroBanca');
        const filtroConcurso = document.getElementById('filtroConcurso');
        const playerArea = document.getElementById('playerArea');

        let questoesFiltradas = [];
        let questaoAtual = null;

        function escaparHTML(valor) {
            return String(valor ?? '').replace(/[&<>"']/g, caractere => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[caractere]);
        }

        function extrairIdYoutube(valor) {
            if (!valor) return '';

            const texto = String(valor).trim();

            if (/^[a-zA-Z0-9_-]{11}$/.test(texto)) {
                return texto;
            }

            const iframe = texto.match(/src=["']([^"']+)["']/i);
            const urlTexto = iframe ? iframe[1] : texto;

            try {
                const url = new URL(urlTexto);

                if (
                    url.hostname === 'www.youtube.com' ||
                    url.hostname === 'youtube.com' ||
                    url.hostname === 'www.youtube-nocookie.com' ||
                    url.hostname === 'youtube-nocookie.com'
                ) {
                    const encontrado = url.pathname.match(
                        /\/(?:embed|shorts)\/([^/?]+)/
                    );

                    return encontrado
                        ? encontrado[1]
                        : url.searchParams.get('v') || '';
                }

                if (url.hostname === 'youtu.be') {
                    return url.pathname.slice(1).split('/')[0];
                }

            } catch (erro) {
                console.error('Erro ao identificar vídeo:', erro);
            }

            return '';
        }

        function carregarFiltros() {
            if (!Array.isArray(RESOLUCOES)) {
                listaQuestoes.innerHTML = `
                    <div class="sem-questoes">
                        Não foi possível carregar as questões.
                    </div>
                `;
                return;
            }

            const bancas = [...new Set(
                RESOLUCOES.map(q => q.banca).filter(Boolean)
            )].sort();

            filtroBanca.innerHTML =
                '<option value="">Todas as bancas</option>';

            bancas.forEach(banca => {
                filtroBanca.innerHTML += `
                    <option value="${escaparHTML(banca)}">
                        ${escaparHTML(banca)}
                    </option>
                `;
            });

            atualizarConcursos();
            renderizarQuestoes();
        }

        function atualizarConcursos() {
            const bancaSelecionada = filtroBanca.value;

            const concursos = [...new Set(
                RESOLUCOES
                    .filter(q => !bancaSelecionada || q.banca === bancaSelecionada)
                    .map(q => q.concurso)
                    .filter(Boolean)
            )].sort();

            filtroConcurso.innerHTML =
                '<option value="">Todos os concursos</option>';

            concursos.forEach(concurso => {
                filtroConcurso.innerHTML += `
                    <option value="${escaparHTML(concurso)}">
                        ${escaparHTML(concurso)}
                    </option>
                `;
            });
        }

        function renderizarQuestoes() {
            const bancaSelecionada = filtroBanca.value;
            const concursoSelecionado = filtroConcurso.value;

            questoesFiltradas = RESOLUCOES.filter(q => {
                const bancaOk =
                    !bancaSelecionada || q.banca === bancaSelecionada;

                const concursoOk =
                    !concursoSelecionado || q.concurso === concursoSelecionado;

                return bancaOk && concursoOk;
            });

            if (!questoesFiltradas.length) {
                listaQuestoes.innerHTML = `
                    <div class="sem-questoes">
                        Nenhuma questão encontrada.
                    </div>
                `;
                return;
            }

            listaQuestoes.innerHTML = questoesFiltradas.map((q, indice) => `
                <button
                    type="button"
                    class="questao-item"
                    id="questao-${indice}"
                    data-indice="${indice}"
                >
                    <strong>${escaparHTML(q.enunciado)}</strong>
                    <small>
                        ${escaparHTML(q.banca)}
                        ${q.ano ? ' • ' + escaparHTML(q.ano) : ''}
                    </small>
                </button>
            `).join('');
        }

        function assistir(indice) {
            questaoAtual = questoesFiltradas[indice];

            if (!questaoAtual) return;

            document.querySelectorAll('.questao-item').forEach(el => {
                el.classList.remove('selecionada');
            });

            const item = document.getElementById('questao-' + indice);

            if (item) {
                item.classList.add('selecionada');
            }

            const linkSalvo =
                (typeof S !== 'undefined' &&
                 S.videosResolucoes &&
                 S.videosResolucoes[questaoAtual.id])
                || questaoAtual.video;

            const videoId = extrairIdYoutube(linkSalvo);

            let conteudo = `
                <h2>${escaparHTML(questaoAtual.enunciado)}</h2>
                <div class="questao-enunciado">
                    ${escaparHTML(questaoAtual.enunciado)}
                </div>
            `;

            if (questaoAtual.alternativas?.length) {
                conteudo += `
                    <div class="alternativas">
                        ${questaoAtual.alternativas.map((alternativa, i) => `
                            <div class="alternativa">
                                ${escaparHTML(alternativa)}
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            if (questaoAtual.gabarito) {
                conteudo += `
                    <div class="gabarito">
                        <strong>Gabarito:</strong>
                        ${escaparHTML(questaoAtual.gabarito)}
                    </div>
                `;
            }

            if (!videoId) {
                conteudo += `
                    <div class="sem-video">
                        <h3>Vídeo ainda não cadastrado</h3>
                        <p>Esta questão ainda não possui uma resolução em vídeo.</p>
                    </div>
                `;

                playerArea.innerHTML = conteudo;
                return;
            }

            const parametros = new URLSearchParams({
                rel: '0'
            });

            const finalSrc =
                `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?${parametros.toString()}`;

            conteudo += `
                <div class="video">
                    <iframe
                        src="${finalSrc}"
                        title="${escaparHTML(questaoAtual.enunciado)}"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen>
                    </iframe>
                </div>
            `;

            playerArea.innerHTML = conteudo;
        }

        listaQuestoes.addEventListener('click', evento => {
            const botao = evento.target.closest('.questao-item');

            if (!botao) return;

            assistir(Number(botao.dataset.indice));
        });

        filtroBanca.addEventListener('change', () => {
            atualizarConcursos();
            renderizarQuestoes();
        });

        filtroConcurso.addEventListener('change', renderizarQuestoes);

        carregarFiltros();
    </script>

</body>
</html>
