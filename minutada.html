<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matemática Minutada | Resultamath</title><link rel="stylesheet" href="estilo.css"></head><body><script src="dados.js"></script><script src="app.js"></script><script>
const m=pagina('minutada'),params=new URLSearchParams(location.search),id=params.get('id');
function render(){const atual=MINUTADA.find(x=>x.id===id);m.innerHTML=`<div class="section-head"><div><span class="tag">VÍDEOS DE 1 MINUTO</span><h1 style="margin-top:8px">Matemática Minutada</h1><p>Conceitos rápidos para revisar e aprender todos os dias.</p></div><span class="tag">${MINUTADA.length} episódios</span></div>`+(atual?`<section class="cartao"><div class="linha"><div><span class="tag">EPISÓDIO ${String(atual.indice).padStart(2,'0')}</span><h2 style="margin-top:10px">${atual.titulo}</h2></div><a class="btn sec" href="minutada.html">Todos os episódios</a></div>${player(S.videosMinutados[atual.id],atual.titulo)}</section>`:'')+`<input class="search-input" id="busca" type="search" placeholder="Buscar assunto..." aria-label="Buscar assunto"><div class="minutada-grid app-minutada" id="lista"></div>`;const lista=document.getElementById('lista');function filtra(){const q=document.getElementById('busca').value.toLocaleLowerCase('pt-BR');lista.innerHTML=MINUTADA.filter(x=>x.titulo.toLocaleLowerCase('pt-BR').includes(q)).map(x=>`<a class="minutada-card" href="minutada.html?id=${encodeURIComponent(x.id)}"><span class="play-mark">▶</span><span><b>${x.titulo}</b><small>EP. ${String(x.indice).padStart(2,'0')} · 1 MIN</small></span><span class="card-arrow">${S.videosMinutados[x.id]?'▶':'›'}</span></a>`).join('')||'<div class="empty-state">Nenhum assunto encontrado.</div>'}document.getElementById('busca').addEventListener('input',filtra);filtra()}
render();
</script><style>.minutada-grid.app-minutada{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.minutada-card{display:flex;align-items:center;gap:10px;padding:14px;background:#fff;border:1px solid #e5edf2;border-radius:12px;color:#172b3a;text-decoration:none}.minutada-card:hover{border-color:#069eda}.minutada-card>span:nth-child(2){display:flex;flex-direction:column}.minutada-card small{font-size:.68rem;color:#069eda;font-weight:800}@media(max-width:900px){.minutada-grid.app-minutada{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.minutada-grid.app-minutada{grid-template-columns:1fr}}</style></body></html>
