
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plano de estudos | Resultamath</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<script src="dados.js"></script>
<script src="app.js"></script>

<script>
(function(){

const m = pagina('plano');

const MODULOS = [
'1. Fundamentos da matemática',
'2. Operações fundamentais',
'3. Divisibilidade e fatoração',
'4. Frações e números decimais',
'5. Razão, proporção e porcentagem',
'6. Potenciação e radiciação',
'7. Expressões numéricas e algébricas',
'8. Equações e sistemas',
'9. Grandezas, medidas e geometria',
'10. Estatística e probabilidade'
];

const META = 10;
const questoes = typeof QUESTOES !== 'undefined' ? QUESTOES : [];
const respostas = (typeof S !== 'undefined' && S.resp) ? S.resp : {};

function progresso(modulo){
    const lista = questoes.filter(q => q.modulo === modulo);
    const feitas = lista.filter(q =>
        Object.prototype.hasOwnProperty.call(respostas,q.id)
    ).length;

    const acertos = lista.filter(q => respostas[q.id] === true).length;

    return {
        total: lista.length,
        feitas,
        acertos,
        erros: feitas - acertos,
        percentual: lista.length ? Math.round(feitas/lista.length*100) : 0
    };
}

m.innerHTML = `
<h1>Plano de estudos</h1>
<p class="suave">
Uma trilha organizada para estudar os 10 módulos da matemática.
</p>

<div class="grade">
    <div class="cartao">
        <span class="suave">Módulos</span>
        <h2>10</h2>
    </div>
    <div class="cartao">
        <span class="suave">Questões</span>
        <h2>${questoes.length}</h2>
    </div>
    <div class="cartao">
        <span class="suave">Meta por módulo</span>
        <h2>${META}</h2>
    </div>
</div>

<h2 style="margin-top:28px">Sua trilha de estudos</h2>
<p class="suave">Complete os exercícios de cada módulo antes de avançar.</p>

${MODULOS.map((modulo,i)=>{
    const p = progresso(modulo);
    const concluido = p.feitas >= p.total && p.total > 0;

    return `
    <section class="cartao" style="margin-bottom:14px">
        <div class="linha" style="justify-content:space-between">
            <div>
                <span class="tag">MÓDULO ${i+1}</span>
                <h3 style="margin:8px 0">${modulo.replace(/^\\d+\\. /,'')}</h3>
            </div>
            <strong>${p.feitas}/${p.total}</strong>
        </div>

        <div style="height:8px;background:var(--linha,#e5e7eb);border-radius:20px;overflow:hidden;margin:14px 0">
            <div style="height:100%;width:${p.percentual}%;background:#069eda;border-radius:20px"></div>
        </div>

        <p class="suave">
            ${p.acertos} acertos · ${p.erros} erros · ${p.percentual}% concluído
        </p>

        <a class="btn ${concluido ? 'sec' : ''}"
           href="exercicios.html?modulo=${encodeURIComponent(modulo)}">
           ${concluido ? 'Revisar módulo' : 'Estudar módulo'}
        </a>
    </section>`;
}).join('')}

<div class="cartao" style="margin-top:24px">
    <h3>Revisão</h3>
    <p class="suave">Retome as questões que errou e revise os conteúdos estudados.</p>
    <a class="btn sec" href="erros.html">Acessar caderno de erros</a>
</div>
`;

})();
</script>

</body>
</html>
