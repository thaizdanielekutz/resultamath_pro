
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configurações | Resultamath</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<script src="dados.js"></script>
<script src="app.js"></script>

<script>
const m = pagina('configuracoes');

m.innerHTML = `
<span class="tag">PERSONALIZAÇÃO</span>

<h1 style="margin-top:8px">Configurações</h1>

<p>Gerencie seu perfil e acompanhe seus dados de estudo.</p>

<section class="cartao">
    <h2>Seu perfil</h2>

    <label for="n">Nome de exibição</label>

    <input
        id="n"
        maxlength="60"
        placeholder="Como podemos chamar você?"
        value="${String(S.nome||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"
    >

    <p>
        <button class="btn" id="salvaNome">
            Salvar perfil
        </button>
    </p>
</section>

<section class="cartao">
    <h2>Dados e progresso</h2>

    <p class="suave">
        Seu progresso de estudos fica salvo neste navegador.
    </p>

    <button class="btn sec" id="zerar">
        Zerar progresso
    </button>
</section>
`;

document.getElementById('salvaNome').onclick = () => {
    S.nome = document.getElementById('n').value.trim();
    salvar();
    alert('Perfil atualizado com sucesso!');
};

document.getElementById('zerar').onclick = () => {
    if(confirm('Apagar todo o progresso deste navegador?')) {
        S = {
            nome: S.nome,
            feitas: {},
            resp: {},
            erros: [],
            simulados: [],
            videosAulas: S.videosAulas || {},
            videosQuestoes: S.videosQuestoes || {},
            videosMinutados: S.videosMinutados || {},
            videosResolucoes: S.videosResolucoes || {}
        };

        salvar();
        location.href = 'inicio.html';
    }
};
</script>

</body>
</html>
