
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>Matemática Minutada | Resultamath</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <script src="dados.js"></script>
    <script src="app.js"></script>

    <script>
        const m = pagina('minutada');
        const params = new URLSearchParams(location.search);
        const id = params.get('id');

        function escaparHTML(valor) {
            return String(valor ?? '').replace(/[&<>"']/g, caractere => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[caractere]);
        }

        function extrairIdYoutube(valor) {
            if (!valor) return '';

            const texto = String(valor).trim();

            // Aceita o próprio ID do vídeo
            if (/^[a-zA-Z0-9_-]{11}$/.test(texto)) {
                return texto;
            }

            // Aceita também iframe completo
            const iframe = texto.match(/src=["']([^"']+)["']/i);
            const urlTexto = iframe ? iframe[1] : texto;

            try {
                const url = new URL(urlTexto);

                if (
                    url.hostname === 'www.youtube.com' ||
                    url.hostname === 'youtube.com' ||
                    url.hostname === 'www.youtube-nocookie.com' ||
                    url.hostname === 'youtube-nocookie.com'
                ) {
                    const encontrado = url.pathname.match(
                        /\/(?:embed|shorts)\/([^/?]+)/
                    );

                    return encontrado
                        ? encontrado[1]
                        : url.searchParams.get('v') || '';
                }

                if (url.hostname === 'youtu.be') {
                    return url.pathname.slice(1).split('/')[0];
                }

            } catch (erro) {
                console.error('Erro ao identificar vídeo:', erro);
            }

            return '';
        }

        function obterVideo(episodio) {
            const salvo =
                typeof S !== 'undefined' &&
                S.videosMinutados &&
                S.videosMinutados[episodio.id];

            // Prioriza o vídeo cadastrado diretamente no dados.js
            return episodio.video || salvo || '';
        }

        function montarPlayer(video, titulo) {
            const videoId = extrairIdYoutube(video);

            if (!videoId) {
                return `
                    <div class="sem-video-minutada">
                        <h3>Vídeo ainda não cadastrado</h3>
                        <p>Este episódio ainda não possui uma resolução em vídeo.</p>
                    </div>
                `;
            }

            const parametros = new URLSearchParams({
                rel: '0'
            });

            const endereco =
                `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?${parametros.toString()}`;

            return `
                <div class="video-minutada">
                    <iframe
                        src="${endereco}"
                        title="${escaparHTML(titulo)}"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen>
                    </iframe>
                </div>
            `;
        }

        function render() {

            if (!Array.isArray(MINUTADA)) {
                m.innerHTML = `
                    <div class="empty-state">
                        Não foi possível carregar os episódios.
                    </div>
                `;
                return;
            }

            const atual = MINUTADA.find(x => x.id === id);

            m.innerHTML = `

                <div class="section-head">

                    <div>
                        <span class="tag">VÍDEOS DE 1 MINUTO</span>

                        <h1 style="margin-top:8px">
                            Matemática Minutada
                        </h1>

                        <p>
                            Conceitos rápidos para revisar e aprender todos os dias.
                        </p>
                    </div>

                    <span class="tag">
                        ${MINUTADA.length} episódios
                    </span>

                </div>

                ${atual ? `

                    <section class="cartao episodio-atual">

                        <div class="linha">

                            <div>
                                <span class="tag">
                                    EPISÓDIO ${String(atual.indice).padStart(2, '0')}
                                </span>

                                <h2 style="margin-top:10px">
                                    ${escaparHTML(atual.titulo)}
                                </h2>

                                ${atual.descricao ? `
                                    <p>${escaparHTML(atual.descricao)}</p>
                                ` : ''}

                            </div>

                            <a class="btn sec" href="minutada.html">
                                Todos os episódios
                            </a>

                        </div>

                        ${montarPlayer(obterVideo(atual), atual.titulo)}

                    </section>

                ` : ''}

                <input
                    class="search-input"
                    id="busca"
                    type="search"
                    placeholder="Buscar assunto..."
                    aria-label="Buscar assunto"
                >

                <div
                    class="minutada-grid app-minutada"
                    id="lista">
                </div>

            `;

            const lista = document.getElementById('lista');
            const busca = document.getElementById('busca');

            function filtra() {

                const q = busca.value.toLocaleLowerCase('pt-BR');

                const encontrados = MINUTADA.filter(x =>
                    x.titulo.toLocaleLowerCase('pt-BR').includes(q)
                );

                lista.innerHTML = encontrados.map(x => {

                    const temVideo = Boolean(obterVideo(x));

                    return `
                        <a
                            class="minutada-card"
                            href="minutada.html?id=${encodeURIComponent(x.id)}"
                        >

                            <span class="play-mark">▶</span>

                            <span>
                                <b>${escaparHTML(x.titulo)}</b>

                                <small>
                                    EP. ${String(x.indice).padStart(2, '0')} · 1 MIN
                                </small>
                            </span>

                            <span class="card-arrow">
                                ${temVideo ? '▶' : '›'}
                            </span>

                        </a>
                    `;

                }).join('') || `
                    <div class="empty-state">
                        Nenhum assunto encontrado.
                    </div>
                `;
            }

            busca.addEventListener('input', filtra);

            filtra();
        }

        render();

    </script>

    <style>
        .minutada-grid.app-minutada {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .minutada-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px;
            background: #fff;
            border: 1px solid #e5edf2;
            border-radius: 12px;
            color: #172b3a;
            text-decoration: none;
        }

        .minutada-card:hover {
            border-color: #069eda;
        }

        .minutada-card > span:nth-child(2) {
            display: flex;
            flex-direction: column;
        }

        .minutada-card small {
            font-size: .68rem;
            color: #069eda;
            font-weight: 800;
        }

        .video-minutada {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 18px;
        }

        .video-minutada iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .sem-video-minutada {
            margin-top: 18px;
            padding: 30px 20px;
            text-align: center;
            background: #f8fafc;
            border-radius: 12px;
            color: #777;
        }

        .sem-video-minutada h3 {
            color: #172b3a;
        }

        @media(max-width: 900px) {
            .minutada-grid.app-minutada {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media(max-width: 520px) {
            .minutada-grid.app-minutada {
                grid-template-columns: 1fr;
            }

            .episodio-atual .linha {
                flex-wrap: wrap;
                gap: 12px;
            }
        }
    </style>

</body>
</html>
