
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conteúdo | Resultamath</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<script src="dados.js"></script>
<script src="app.js"></script>

<script>
const m = pagina('biblioteca');

const id = new URLSearchParams(location.search).get('id');
const resumo = RESUMOS.find(r => r.id === id);

if (!resumo) {

    m.innerHTML = `
        <section class="cartao">
            <h1>Conteúdo não encontrado</h1>
            <p class="suave">Este conteúdo não está disponível.</p>
            <a class="btn" href="biblioteca.html">Voltar à biblioteca</a>
        </section>
    `;

} else {

    m.innerHTML = `

        <p>
            <a href="biblioteca.html">← Voltar à biblioteca</a>
        </p>

        <span class="tag">${resumo.modulo}</span>

        <h1 style="margin-top:10px">${resumo.titulo}</h1>

        <p class="muted">Material de estudo • ResultaMath</p>

        <section class="cartao resumo-conteudo">
            ${resumo.conteudo}
        </section>

        <div class="linha" style="justify-content:flex-start">
            <a class="btn sec" href="biblioteca.html">
                Voltar à biblioteca
            </a>
        </div>

    `;
}
</script>

</body>
</html>
