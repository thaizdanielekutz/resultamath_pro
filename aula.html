<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula – Resultamath</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<script src="dados.js"></script>
<script src="app.js"></script>
<script>
const m=pagina('biblioteca'),a=AULAS.find(x=>x.id==new URLSearchParams(location.search).get('id'));
if(!a){m.innerHTML='<h1>Aula não encontrada</h1><a class="btn" href="biblioteca.html">Voltar à biblioteca</a>'}
else{
 const mostra=()=>{m.innerHTML=`<p><a href="biblioteca.html">← Biblioteca de aulas</a></p><h1>${a.titulo}</h1><p class="suave">${a.modulo}</p>`+(a.video?`<iframe class="video" src="${a.video}" title="${a.titulo}" allowfullscreen></iframe>`:`<div class="video"><div><b>Vídeo da aula</b><p>Adicione o link em dados.js.</p></div></div>`)+
 `<div class="cartao"><h2>Resumo e fórmulas</h2><p>${a.resumo||'Adicione o resumo desta aula em dados.js.'}</p></div><div class="linha" style="justify-content:flex-start"><button class="btn" onclick="alterna()">${S.feitas[a.id]?'Aula concluída ✓':'Marcar como concluída'}</button><a class="btn sec" href="exercicios.html?modulo=${encodeURIComponent(a.modulo)}">Fazer exercícios deste módulo</a></div>`};
 window.alterna=()=>{S.feitas[a.id]=!S.feitas[a.id];salvar();mostra()};mostra();
}
</script>
</body>
</html>
