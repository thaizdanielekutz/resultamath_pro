<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aula | Resultamath</title><link rel="stylesheet" href="estilo.css"></head><body><script src="dados.js"></script><script src="app.js"></script><script>
const m=pagina('biblioteca'),a=AULAS.find(x=>x.id===new URLSearchParams(location.search).get('id'));
if(!a){m.innerHTML='<h1>Aula não encontrada</h1><a class="btn" href="biblioteca.html">Voltar à biblioteca</a>'}else{const mostra=()=>{m.innerHTML=`<p><a href="biblioteca.html">← Biblioteca de aulas</a></p><span class="tag">${a.modulo}</span><h1 style="margin-top:10px">${a.titulo}</h1><p class="muted">Aula em vídeo • resumo • prática</p>${player(S.videosAulas[a.id]||a.video,a.titulo)}<section class="cartao"><h2>Resumo e fórmulas</h2><p>${a.resumo||'O resumo desta aula será disponibilizado em breve.'}</p></section><div class="linha" style="justify-content:flex-start"><button class="btn" onclick="alterna()">${S.feitas[a.id]?'✓ Aula concluída':'Marcar como concluída'}</button><a class="btn sec" href="exercicios.html?modulo=${encodeURIComponent(a.modulo)}">Praticar este módulo</a></div>`};window.alterna=()=>{S.feitas[a.id]=!S.feitas[a.id];salvar();mostra()};mostra()}
</script></body></html>
