
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu desempenho | Resultamath</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<script src="dados.js"></script>
<script src="app.js"></script>

<script>

(function() {

    const m = pagina('desempenho');

    if (!m) return;

    const questoes = typeof QUESTOES !== 'undefined' ? QUESTOES : [];
    const respostas = S.resp || {};

    const modulos = [...new Set(questoes.map(q => q.modulo))];

    let totalRespondidas = 0;
    let totalAcertos = 0;

    function percentual(a, b) {
        return b ? Math.round((a / b) * 100) : 0;
    }

    function progresso(valor) {
        return `
            <div style="
                width:100%;
                height:9px;
                background:var(--linha,#e5e7eb);
                border-radius:20px;
                overflow:hidden;
                margin:10px 0;
            ">
                <div style="
                    width:${valor}%;
                    height:100%;
                    background:#069eda;
                    border-radius:20px;
                "></div>
            </div>
        `;
    }

    const cards = modulos.map(mod => {

        const lista = questoes.filter(q => q.modulo === mod);

        const respondidas = lista.filter(q =>
            Object.prototype.hasOwnProperty.call(respostas, q.id)
        );

        const acertos = respondidas.filter(q =>
            respostas[q.id] === true
        );

        const erros = respondidas.length - acertos.length;

        const aproveitamento = percentual(
            acertos.length,
            respondidas.length
        );

        totalRespondidas += respondidas.length;
        totalAcertos += acertos.length;

        return `
            <section class="cartao">

                <h2>${mod}</h2>

                <div class="grade">

                    <div class="stat-card">
                        <span class="muted">Questões</span>
                        <span class="num">${lista.length}</span>
                    </div>

                    <div class="stat-card">
                        <span class="muted">Respondidas</span>
                        <span class="num">${respondidas.length}</span>
                    </div>

                    <div class="stat-card">
                        <span class="muted">Acertos</span>
                        <span class="num">${acertos.length}</span>
                    </div>

                    <div class="stat-card">
                        <span class="muted">Erros</span>
                        <span class="num">${erros}</span>
                    </div>

                </div>

                <div class="linha" style="margin-top:18px">
                    <span class="suave">Aproveitamento</span>
                    <b>${aproveitamento}%</b>
                </div>

                ${progresso(aproveitamento)}

                <p class="suave">
                    ${respondidas.length} de ${lista.length} questões respondidas.
                </p>

                <a class="btn sec"
                   href="exercicios.html?modulo=${encodeURIComponent(mod)}">
                   Praticar este módulo →
                </a>

            </section>
        `;

    }).join('');

    const aproveitamentoGeral = percentual(
        totalAcertos,
        totalRespondidas
    );

    m.innerHTML = `

        <div class="section-head">
            <div>
                <span class="tag">ACOMPANHAMENTO</span>
                <h1 style="margin-top:8px">Meu desempenho</h1>
                <p>Acompanhe sua evolução nos exercícios.</p>
            </div>
        </div>

        <section class="cartao">

            <h2>Desempenho geral</h2>

            <div class="grade">

                <div class="stat-card">
                    <span class="muted">Questões cadastradas</span>
                    <span class="num">${questoes.length}</span>
                </div>

                <div class="stat-card">
                    <span class="muted">Respondidas</span>
                    <span class="num">${totalRespondidas}</span>
                </div>

                <div class="stat-card">
                    <span class="muted">Acertos</span>
                    <span class="num">${totalAcertos}</span>
                </div>

                <div class="stat-card">
                    <span class="muted">Erros</span>
                    <span class="num">${totalRespondidas - totalAcertos}</span>
                </div>

            </div>

            <div class="linha" style="margin-top:18px">
                <span class="suave">Aproveitamento geral</span>
                <b>${aproveitamentoGeral}%</b>
            </div>

            ${progresso(aproveitamentoGeral)}

        </section>

        <div class="section-head">
            <div>
                <h2>Desempenho por módulo</h2>
                <p>Confira seus resultados em cada área.</p>
            </div>
        </div>

        ${cards || `
            <section class="cartao">
                <h2>Nenhuma questão cadastrada</h2>
                <p>Os resultados aparecerão aqui quando os exercícios forem adicionados.</p>
            </section>
        `}

        <div class="linha" style="justify-content:flex-start;flex-wrap:wrap">

            <a class="btn sec" href="exercicios.html">
                Voltar aos exercícios
            </a>

            <a class="btn sec" href="erros.html">
                Caderno de erros
            </a>

        </div>

    `;

})();

</script>

</body>
</html>
