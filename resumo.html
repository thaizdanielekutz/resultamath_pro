
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resumo | Resultamath</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<script src="dados.js"></script>
<script src="app.js"></script>

<script>
const id = new URLSearchParams(location.search).get('id');
const resumo = RESUMOS.find(r => r.id === id);
const m = pagina('biblioteca');

if (!resumo) {
    m.innerHTML = `
        <section class="cartao">
            <h2>Conteúdo não encontrado</h2>
            <a class="btn sec" href="biblioteca.html">Voltar à biblioteca</a>
        </section>
    `;
} else {
    document.title = resumo.titulo + ' | Resultamath';

    m.innerHTML = `
        <div class="section-head">
            <div>
                <span class="tag">${resumo.modulo}</span>
                <h1 style="margin-top:8px">${resumo.titulo}</h1>
                <p>Resumo de estudo | ResultaMath</p>
            </div>
        </div>

        <article class="cartao resumo-conteudo">
            ${resumo.conteudo}
        </article>

        <a class="btn sec" href="biblioteca.html">
            ← Voltar à biblioteca
        </a>
    `;
}
</script>

</body>
</html>
